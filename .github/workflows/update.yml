name: update

on:
  schedule:
    # Shortly after HashiCorp's usual release window.
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      product:
        description: "Restrict the run to a single product"
        required: false
        type: string

concurrency:
  group: update
  cancel-in-progress: false

permissions:
  contents: read

# Action commits are pinned in .github/workflows/actions.lock.
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # The token stays out of .git/config. Only the Commit step gets it.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@v23

      - name: Refresh manifests
        env:
          PRODUCT: ${{ inputs.product }}
        run: |
          args=(update -signatures lenient)
          if [ -n "$PRODUCT" ]; then
            args+=(-product "$PRODUCT")
          fi
          nix run .#hcnix -- "${args[@]}"

      - name: Detect changes
        id: changes
        run: |
          if git diff --quiet -- data/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new releases."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- data/
          fi

      - name: Validate manifests
        if: steps.changes.outputs.changed == 'true'
        run: nix run .#hcnix -- check

      # Evaluating every release catches a corrupt manifest; actually fetching
      # a few archives is the only thing that proves the recorded hashes work.
      - name: Check the flake
        if: steps.changes.outputs.changed == 'true'
        run: nix flake check --print-build-logs

      - name: Build the latest release of each product
        if: steps.changes.outputs.changed == 'true'
        run: |
          products=$(nix eval --raw --impure --expr \
            'builtins.concatStringsSep " " (map (p: ".#" + p) (builtins.attrNames (builtins.getFlake (toString ./.)).legacyPackages.${builtins.currentSystem}))')
          # shellcheck disable=SC2086
          nix build --no-link --print-build-logs $products

      - name: Commit
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          summary=$(git diff --cached --shortstat -- data/)
          git commit -m "data: refresh release manifests" -m "$summary"
          git push
