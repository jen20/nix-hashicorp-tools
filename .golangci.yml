version: "2"

linters:
  enable:
    - bodyclose
    - errorlint
    - misspell
    - revive
    - unconvert
    - unparam

  settings:
    revive:
      rules:
        - name: exported
        - name: package-comments

  exclusions:
    rules:
      # Table-driven tests read better with the fixtures inline.
      - path: _test\.go
        linters:
          - unparam

formatters:
  enable:
    - gofmt
